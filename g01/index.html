<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WiiGame Portal</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#15284a;background:#e8edf5}button,input{font:inherit}button{cursor:pointer}
.phone{width:min(100%,390px);height:100dvh;min-height:660px;max-height:900px;margin:auto;background:linear-gradient(180deg,#f4fbff 0,#fff 31%,#fff 100%);position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px #172b4930}
.status{height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:700;color:#142340}.status svg{width:57px;height:16px}.top{height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 23px}.top button{border:0;background:none;color:#607392;font-size:14px;padding:7px 0}.top .back{font-size:25px;font-weight:400}.top .invisible{visibility:hidden}
.main{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding:0 23px 12px;scrollbar-width:none}.main::-webkit-scrollbar{display:none}.hero{height:166px;display:flex;align-items:center;justify-content:center;margin-top:0}.hero img{width:100%;max-width:344px;height:auto;object-fit:contain}.eyebrow{text-align:center;color:#5c708f;font-size:13px;margin:0 0 4px}.heading{text-align:center;font-size:25px;letter-spacing:-.8px;font-weight:800;margin:0 0 12px;color:#17305a}.desc{text-align:center;color:#647997;font-size:13px;line-height:1.55;max-width:305px;margin:0 auto 22px}
.searchbox{height:46px;border:1px solid #dbe3ed;border-radius:15px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#f8fafc;color:#8798b2;margin-bottom:22px}.searchbox svg{width:15px;height:15px;flex-shrink:0}.searchbox input{background:transparent;border:0;outline:0;color:#243c62;width:100%;font-size:13px}.searchbox input::placeholder{color:#94a3bb}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead strong{font-size:13px;letter-spacing:.1px}.sectionhead span{font-size:11px;color:#8193ad}
.countries,.languages{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{height:54px;border-radius:15px;border:1px solid #dfe6ef;background:#fff;color:#253551;display:flex;align-items:center;text-align:left;padding:0 12px;gap:9px;font-size:13px;font-weight:650;min-width:0}.flagcode{display:inline-grid;place-items:center;font-size:12px;font-weight:800;color:#1b3b71;border-radius:50%;background:#eef4ff}.choice.selected{border:1.5px solid #2468ff;background:#eef3ff;box-shadow:0 0 0 1px #2468ff15}.flag{width:27px;height:27px;object-fit:contain;flex-shrink:0}.check{margin-left:auto;border-radius:50%;background:#276aff;color:white;font-size:12px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}.expand{width:100%;height:47px;border:1px solid #e1e7f0;border-radius:15px;background:#f7f9fc;color:#415471;margin-top:11px;font-size:13px}.expand span{font-size:18px;color:#8ea0ba;margin-left:9px}.empty{color:#788ba6;text-align:center;font-size:13px;padding:24px}
.footer{padding:12px 23px max(25px,env(safe-area-inset-bottom));flex-shrink:0;background:linear-gradient(transparent,#fff 12%)}.primary{width:100%;height:53px;border:0;border-radius:14px;background:#2469ff;color:white;font-size:15px;font-weight:700;box-shadow:0 5px 12px #2165f947}.primary span{font-size:20px;margin-left:6px}.homebar{width:128px;height:4px;background:#ccd6e3;border-radius:4px;margin:17px auto 0}.language-hero{height:205px;display:grid;place-items:center;position:relative}.language-hero img{width:min(100%,350px);height:auto;object-fit:contain}.globe{font-size:100px;filter:drop-shadow(0 7px 15px #4286d83a)}.float{position:absolute;font-size:29px}.float.a{left:12%;top:16%}.float.b{right:12%;bottom:20%}.successhero{height:225px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.successhero img{width:min(100%,260px);height:auto;max-height:220px;object-fit:contain}.summary{border:1px solid #dfe7f1;border-radius:17px;padding:0 16px;margin-top:24px;flex-shrink:0}.sumrow{display:flex;justify-content:space-between;align-items:center;min-height:62px;gap:12px;padding:12px 0;border-bottom:1px solid #e7edf5;font-size:14px}.sumrow span{display:inline-flex;align-items:center;gap:9px;min-width:0}.sumrow .sumicon{width:30px;height:30px;object-fit:contain;flex-shrink:0}.sumcode{display:inline-flex!important;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#edf4ff;color:#204d9a!important;font-size:11px;font-weight:800;flex-shrink:0}.sumrow button{white-space:nowrap}.sumrow:last-child{border:0}.sumrow span{color:#73849c}.sumrow button{border:0;background:none;color:#2166ed;font-weight:700}.note{font-size:12px;text-align:center;color:#8795aa;margin-top:18px}.successhero + .eyebrow{margin-top:0}.successhero ~ .heading{position:relative;margin-top:0}
@media(min-width:500px){.phone{margin:18px auto;height:min(884px,calc(100dvh - 36px));border-radius:22px}.hero{height:176px}}@media(max-height:740px){.successhero{height:165px}.successhero img{max-height:155px;max-width:190px}.summary{margin-top:14px}.sumrow{min-height:53px}.note{margin-top:12px}.hero{height:145px}.hero img{max-width:310px}.desc{margin-bottom:15px}.searchbox{margin-bottom:14px}.choice{height:50px}.footer{padding-top:8px;padding-bottom:12px}.homebar{margin-top:11px}}

/* G01 Figma decorative artwork and typography */
.success-visual{height:244px;position:relative;flex-shrink:0}
.portal-tag{position:absolute;right:0;top:0;display:flex;align-items:center;gap:6px;border:1px solid #e4edf5;background:#fff;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:700;color:#20385b;z-index:3}
.online-dot{width:7px;height:7px;border-radius:50%;background:#18c99a}
.successhero{position:absolute;left:0;right:0;top:30px;height:210px;display:flex;align-items:center;justify-content:center;overflow:visible}
.successhero img.mascot{width:min(75%,235px);height:auto;max-height:205px;object-fit:contain}
.successhero img.decor{position:absolute;object-fit:contain;max-height:none}
.successhero .star{width:54px;height:54px;left:4%;top:8px}
.successhero .gamepad{width:48px;height:44px;right:4%;top:17px}
.success-title{margin-top:0;margin-bottom:10px}
.success-desc{margin-bottom:19px}
.success-desc+.summary{margin-top:0}
.language-title{margin-top:4px}
@media(max-height:740px){.success-visual{height:187px}.successhero{height:170px;top:18px}.successhero img.mascot{max-height:166px;max-width:190px}.successhero .star{width:42px;height:42px}.successhero .gamepad{width:38px;height:36px}.portal-tag{font-size:10px}.success-desc{margin-bottom:13px}}
</style></head><body><div class="phone"><div class="status"><span>9:41</span><svg viewBox="0 0 57 16" fill="#172743"><path d="M1 11h3v4H1zm5-3h3v7H6zm5-3h3v10h-3zm5-3h3v13h-3z"/><path d="M25 5Q32-1 39 5l-2 2Q32 3 27 7zm4 4q3-3 6 0l-3 4z"/><rect x="43" y="3" width="12" height="10" rx="2" fill="none" stroke="#172743" stroke-width="1.5"/><rect x="45" y="5" width="8" height="6" rx="1"/><path d="M56 6v4" stroke="#172743" stroke-width="2"/></svg></div><div class="top"><button id="back" class="back invisible" aria-label="Quay lại">‹</button><button id="skip">Bỏ qua</button></div><div class="main" id="content"></div><div class="footer"><button id="next" class="primary">Tiếp tục <span>→</span></button><div class="homebar"></div></div></div>
<script>
const countries=[['vn','Việt Nam'],['mm','Myanmar'],['th','Thái Lan'],['id','Indonesia'],['my','Malaysia'],['sg','Singapore'],['ph','Philippines'],['kh','Campuchia'],['la','Lào'],['jp','Nhật Bản'],['kr','Hàn Quốc'],['us','Hoa Kỳ'],['gb','Anh'],['fr','Pháp']];
const languages=[['vn','Tiếng Việt'],['gb','English'],['mm','မြန်မာ'],['th','ภาษาไทย'],['id','Bahasa Indonesia'],['my','Bahasa Melayu'],['sg','English (SG)'],['jp','日本語'],['kr','한국어'],['fr','Français']];
let step=0,country='Việt Nam',language='Tiếng Việt',expanded=false,query='';
const flagFor=(value,options)=>{const entry=options.find(item=>item[1]===value);const code=entry?entry[0]:'vn';return ['vn','mm','th','id','my','sg'].includes(code)?`<img class="sumicon" src="assets/flag-${code}.webp" alt="Cờ ${esc(value)}">`:`<span class="sumcode" aria-label="${esc(value)}">${code.toUpperCase()}</span>`};
const $=id=>document.getElementById(id);
function esc(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 $('back').classList.toggle('invisible',step===0);$('skip').style.visibility=step===0?'visible':'hidden';
 $('next').innerHTML=(step===2?'Bắt đầu':'Tiếp tục')+' <span>→</span>';
 if(step===0){$('content').innerHTML=`<div class="hero"><img src="assets/mascot-country.webp" alt="WiiGame mascot Figma"></div><p class="eyebrow">Chào mừng đến với</p><h1 class="heading">WiiGame Portal</h1><p class="desc">Chọn quốc gia để có trải nghiệm phù hợp về ngôn ngữ, giá gói cước và nội dung game.</p><label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="countrySearch" placeholder="Tìm quốc gia..." value="${esc(query)}" autocomplete="off"></label><div class="sectionhead"><strong>QUỐC GIA PHỔ BIẾN</strong><span>${expanded?'Tất cả quốc gia':'6 khu vực'}</span></div><div class="countries" id="countryList"></div><button class="expand" id="expand">${expanded?'Thu gọn':'Xem tất cả quốc gia'} <span>${expanded?'⌃':'›'}</span></button>`;renderCountries();$('countrySearch').oninput=e=>{query=e.target.value;renderCountries()};$('expand').onclick=()=>{expanded=!expanded;render()}}
 if(step===1){$('content').innerHTML=`<div class="language-hero"><img src="assets/language-illustration.webp" alt="Hình quả địa cầu và biểu tượng ngôn ngữ từ Figma"></div><h1 class="heading language-title">Chọn ngôn ngữ</h1><p class="desc">Bạn có thể thay đổi ngôn ngữ bất cứ lúc nào trong phần cài đặt.</p><div class="sectionhead"><strong>NGÔN NGỮ</strong><span>${languages.length} lựa chọn</span></div><div class="languages" id="languageList"></div>`;const box=$('languageList');languages.forEach(([flag,name])=>{let b=document.createElement('button');b.className='choice'+(language===name?' selected':'');b.innerHTML=`${["vn","mm","th","id","my","sg"].includes(flag)?`<img class="flag" src="assets/flag-${flag}.webp" alt="">`:`<span class="flag flagcode">${flag.toUpperCase()}</span>`}<span>${name}</span>${language===name?'<span class="check">✓</span>':''}`;b.onclick=()=>{language=name;render()};box.append(b)})}
 if(step===2){$('content').innerHTML=`<div class="success-visual"><div class="portal-tag"><span class="online-dot"></span> WiiGame Portal</div><div class="successhero"><img class="mascot" src="assets/mascot-success.webp" alt="WiiGame mascot"><img class="decor star" src="assets/star-decor.webp" alt=""><img class="decor gamepad" src="assets/gamepad-decor.webp" alt=""></div></div><h1 class="heading success-title">Hoàn tất!</h1><p class="desc success-desc">Chào mừng bạn đến với WiiGame Portal</p><div class="summary"><div class="sumrow"><span>${flagFor(country,countries)} Quốc gia</span><button id="editCountry">${esc(country)} ✎</button></div><div class="sumrow"><span>${flagFor(language,languages)} Ngôn ngữ</span><button id="editLanguage">${esc(language)} ✎</button></div></div><p class="note">Bạn có thể thay đổi quốc gia và ngôn ngữ trong phần cài đặt.</p>`;$('editCountry').onclick=()=>{step=0;render()};$('editLanguage').onclick=()=>{step=1;render()}}
}
function renderCountries(){const list=$('countryList');list.innerHTML='';const filtered=countries.filter(x=>(expanded||query||countries.indexOf(x)<6)&&x[1].toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));filtered.forEach(([flag,name])=>{const b=document.createElement('button');b.className='choice'+(country===name?' selected':'');b.innerHTML=`${["vn","mm","th","id","my","sg"].includes(flag)?`<img class="flag" src="assets/flag-${flag}.webp" alt="">`:`<span class="flag flagcode">${flag.toUpperCase()}</span>`}<span>${name}</span>${country===name?'<span class="check">✓</span>':''}`;b.onclick=()=>{country=name;render()};list.append(b)});if(!filtered.length)list.innerHTML='<p class="empty">Không tìm thấy quốc gia</p>'}
$('back').onclick=()=>{if(step>0){step--;render()}};$('skip').onclick=()=>{step=2;render()};$('next').onclick=()=>{if(step<2){step++;render()}else{localStorage.setItem('wiigame-prefs',JSON.stringify({country,language}));alert('Đã lưu lựa chọn: '+country+' · '+language+'\\nDemo G01 hoàn tất.')}};render();
</script></body></html>

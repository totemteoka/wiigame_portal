function initChipScroll(){
 const el=document.querySelector('.chips');
 if(!el)return;
 let pointerId=null,startX=0,startScroll=0,moved=false,suppress=false;
 el.addEventListener('pointerdown',e=>{
   if(e.pointerType==='touch'||e.button!==0)return;
   pointerId=e.pointerId;startX=e.clientX;startScroll=el.scrollLeft;moved=false;
   el.classList.add('dragging');
 });
 window.addEventListener('pointermove',e=>{
   if(pointerId!==e.pointerId)return;
   const dx=e.clientX-startX;
   if(Math.abs(dx)>5){moved=true;el.classList.add('is-dragging')}
   if(moved){el.scrollLeft=startScroll-dx;e.preventDefault()}
 },{passive:false});
 const stop=e=>{
   if(pointerId!==e.pointerId)return;
   if(moved){suppress=true;setTimeout(()=>suppress=false,0)}
   pointerId=null;el.classList.remove('dragging','is-dragging');
 };
 window.addEventListener('pointerup',stop);
 window.addEventListener('pointercancel',stop);
 el.addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopImmediatePropagation()}},true);
 el.addEventListener('dragstart',e=>e.preventDefault());
 el.addEventListener('wheel',e=>{
   if(el.scrollWidth<=el.clientWidth)return;
   if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
     e.preventDefault();el.scrollLeft+=e.deltaY;
   }
 },{passive:false});
}

.onclick=sortModal;if($('sortbtn'))$('sortbtn').onclick=sortModal;if($('clearhistory'))$('clearhistory').onclick=()=>{state.searchHistory=[];render()};document.querySelectorAll('[data-package]').forEach(b=>b.onclick=()=>purchasePackage(b.dataset.package));if($('joinTournament'))$('joinTournament').onclick=()=>{if(!requireLogin('G10'))return;if(state.credits<1){modal('Bạn chưa có lượt chơi','<p>Hãy chọn gói chơi để tham gia giải đấu.</p><button class="primary" id="buyTournament">Xem gói chơi</button>');$('buyTournament').onclick=()=>{closeModal();go('G12')};return}state.tournamentJoined=true;render()};if($('backgames'))$('backgames').onclick=()=>go('G03');if($('favorite'))$('favorite').onclick=toggleFav;if($('favorite2'))$('favorite2').onclick=toggleFav}
function toggleFav(){if(!state.loggedIn){openAccount();return}const i=state.favorites.indexOf(state.game);if(i<0)state.favorites.push(state.game);else state.favorites.splice(i,1);render()}
function openG01(){const p=$('phone');p.classList.add('g01mode');const frame=document.createElement('iframe');frame.className='g01frame';frame.id='g01frame';frame.src='g01/index.html';p.append(frame);const b=document.createElement('button');b.className='switchdemo';b.id='exitg01';b.textContent='← Vào trang chủ';b.onclick=()=>{frame.remove();b.remove();p.classList.remove('g01mode');go('G02')};p.append(b)}
function render(){saveAccount();if($('phone').classList.contains('g01mode'))return;const s=$('screen');s.innerHTML=({G02:home,G03:allGames,G04:categoryPage,G05:searchPage,G06:results,G07:detail,G08:loginView,G09:myGames,G10:tournament,G11:rewards,G12:packagesPage,ACCOUNT_HISTORY:accountSubpage,ACCOUNT_LOCALE:accountSubpage,ACCOUNT_SUPPORT:accountSubpage}[state.page]||home)();$('bottomnav').innerHTML=(state.page==='G08'||state.page.startsWith('ACCOUNT_'))?'':nav();const dn=$('desktopnav');if(dn)dn.innerHTML=nav();$('bottomnav').style.display=(state.page==='G08'||state.page.startsWith('ACCOUNT_'))?'none':'flex';$('notifications').onclick=()=>modal('Thông báo','<p>Chưa có thông báo mới trong bản demo.</p>');$('profile').onclick=openAccount;wire();if(state.page==='G08'||state.page.startsWith('ACCOUNT_'))wireLogin();history.replaceState(null,'','#/'+state.page)}
// G08: Luồng đăng nhập/đăng ký, nhập điện thoại, lỗi, gửi lại OTP và xác thực demo.
const login={stage:'intro',phone:localStorage.getItem('wiigame_demo_phone')||'',otp:'',error:'',cooldown:0};
function openAccount(){if(state.loggedIn){go('G08');return}login.stage='intro';login.error='';go('G08')}
function loginBack(){if(login.stage==='otp'){login.stage='phone'}else if(login.stage==='phone'){login.stage='intro'}else{go('G02');return}render()}
function keypad(){return `<div class="g08-keypad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map((v,i)=>`<button data-digit="${v}" aria-label="${v==='⌫'?'Xóa':v}">${v}${v&&!isNaN(+v)&&v!=='0'&&v!=='1'?`<small>${['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'][i]||''}</small>`:''}</button>`).join('')}</div>`}
function loginIntro(){return `<section class="auth intro"><button class="auth-skip" id="authskip">Bỏ qua</button><div class="auth-mascot"><img src="assets/g08-intro-hero.webp" alt="Mascot WiiGame và Corgi gốc Figma"></div><h2>Chơi game không giới hạn</h2><p>Đăng nhập bằng số điện thoại để bắt đầu trải nghiệm</p><div class="benefits"><div><img src="assets/login-benefit-game.webp" alt=""><span><b>Truy cập 40+ game hấp dẫn</b><small>Chơi mọi lúc, mọi nơi</small></span></div><div><img src="assets/login-benefit-crown.webp" alt=""><span><b>Lưu tiến trình chơi</b><small>Chơi mọi lúc, mọi thiết bị</small></span></div><div><img src="assets/login-benefit-gift.webp" alt=""><span><b>Nhận ưu đãi dành riêng cho bạn</b><small>Sự kiện, nhiệm vụ, quà tặng</small></span></div></div><button class="primary auth-cta" id="startlogin">Đăng nhập bằng số điện thoại →</button><p class="auth-note">Bằng việc tiếp tục, bạn đồng ý với Điều khoản sử dụng và Chính sách quyền riêng tư</p></section>`}
function loginPhone(){let invalid=!!login.error;return `<section class="auth"><button class="auth-back" id="authback" aria-label="Quay lại">‹</button><h2>Đăng nhập / Đăng ký</h2><p>Nhập số điện thoại của bạn<br>để nhận mã OTP</p><div class="auth-mascot small"><img src="assets/${invalid?'g08-error-avatar':'g08-phone-mascot'}.webp" alt="Mascot đăng nhập Figma"></div><div class="phone-entry ${invalid?'invalid':''}"><span>🇻🇳 +84 ⌄</span><input id="phoneinput" type="tel" inputmode="none" maxlength="11" placeholder="912 345 678" value="${login.phone}" aria-label="Số điện thoại"></div><p class="auth-error" id="phoneerror">${login.error||''}</p><button class="primary" id="sendotp" ${login.phone.replace(/\D/g,'').length<9?'disabled':''}>Tiếp tục →</button>${keypad()}</section>`}
function loginOtp(){return `<section class="auth"><button class="auth-back" id="authback" aria-label="Quay lại">‹</button><div class="otp-head"><h2>Đã gửi mã OTP</h2><p>Chúng tôi đã gửi mã OTP đến số điện thoại<br><b>+84 ${login.phone}</b></p></div><div class="otp-graphic"><img src="assets/g08-otp-envelope.webp" alt="Phong bì OTP đã xác thực theo Figma"></div><div class="otp-boxes">${Array.from({length:6},(_,i)=>`<button data-otpbox="${i}" class="${i===login.otp.length?'focus':''}">${login.otp[i]||''}</button>`).join('')}</div><p class="auth-error otp-error">${login.error||''}</p><p class="otp-caption">Mã OTP có hiệu lực trong vòng <b>02:00</b></p><button class="auth-link" id="resend" ${login.cooldown>0?"disabled":""}>${login.cooldown>0?"Gửi lại mã OTP (00:"+String(login.cooldown).padStart(2,"0")+")":"Gửi lại mã OTP"}</button>${keypad()}</section>`}

function accountIcon(kind){const paths={
back:'<path d="m14 18-6-6 6-6"/><path d="M9 12h12"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l2-1.5-2-3.5-2.5.6-2.6-1.5-.5-2.6h-4l-.5 2.6-2.6 1.5L3.8 5.5l-2 3.5L4 10.5v3l-2.2 1.5 2 3.5 2.5-.6 2.6 1.5.5 2.6h4l.5-2.6 2.6-1.5 2.5.6 2-3.5Z"/>',
game:'<rect x="3" y="7" width="18" height="11" rx="4"/><path d="M7 12h5m-2.5-2.5v5M16 11h.01M18 14h.01"/>',
crown:'<path d="m2 7 5 4 5-7 5 7 5-4-2 12H4Z"/>',
history:'<path d="M3 12a9 9 0 1 0 3-7"/><path d="M3 4v5h5M12 7v5l4 2"/>',
trophy:'<path d="M7 4h10v8a5 5 0 0 1-10 0ZM7 6H4v3a4 4 0 0 0 4 4M17 6h3v3a4 4 0 0 1-4 4M12 17v4M8 21h8"/>',
gift:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M2 9h20M12 9v12M12 9c-9 0-8-7-4-7 3 0 4 7 4 7Zm0 0c9 0 8-7 4-7-3 0-4 7-4 7Z"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-6 5-6 13 0 18M12 3c6 5 6 13 0 18"/>',
support:'<path d="M3 13v-2a9 9 0 0 1 18 0v2M3 13h4v7H5a2 2 0 0 1-2-2ZM21 13h-4v7h2a2 2 0 0 0 2-2Z"/>',
logout:'<path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M15 16l4-4-4-4M8 12h11"/>',
chevron:'<path d="m9 6 6 6-6 6"/>',
star:'<path d="m12 2 3 6 7 .9-5 5 .9 7L12 18l-5.9 2.9L7 14l-5-5L9 8Z"/>',
ticket:'<path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4ZM12 5v14"/>'
};return `<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[kind]||paths.chevron}</svg>`}
function accountRow(icon,title,desc,target){return `<button class="account-row" data-go="${target}"><span class="account-rowicon">${accountIcon(icon)}</span><span class="account-rowtext"><strong>${title}</strong><small>${desc}</small></span><span class="account-chevron">${accountIcon('chevron')}</span></button>`}
function accountView(){const points=state.scores.reduce((n,s)=>n+s.score,0);const rank=state.scores.length?Math.max(1,20-state.scores.length):'—';const phone=login.phone||localStorage.getItem('wiigame_demo_phone')||'';const pack=packages.find(p=>p.id===state.packageId);return `<section class="account-page">
<div class="account-head"><button class="account-back" id="accountback" aria-label="Quay về trang chủ">${accountIcon('back')}</button><h2>Tài khoản của tôi</h2><button class="account-back" id="accountsettings" aria-label="Cài đặt">${accountIcon('settings')}</button></div>
<div class="account-profile"><img src="assets/login-mascot.webp" alt="WiiGame mascot"><div class="account-identity"><strong>WiiGame Player</strong><small>+84 ${phone}</small><span class="account-verified">✓ Đã xác thực</span></div></div>
<div class="account-stats"><button data-go="G09"><span>${accountIcon('ticket')}</span><strong>${state.credits}</strong><small>Lượt chơi</small></button><button data-go="G11"><span>${accountIcon('star')}</span><strong>${points.toLocaleString('vi-VN')}</strong><small>Điểm tích lũy</small></button><button data-go="G11"><span>${accountIcon('trophy')}</span><strong>${rank}</strong><small>Hạng hiện tại</small></button></div>
<div class="account-group">${accountRow('game','Game của tôi','Game đã chơi và yêu thích','G09')}${accountRow('crown','Gói chơi của tôi',pack?pack.name+' · '+state.credits+' lượt còn lại':'Chưa đăng ký gói chơi','G12')}${accountRow('history','Lịch sử giao dịch','Gói đã mua và lượt đã sử dụng','ACCOUNT_HISTORY')}${accountRow('trophy','Giải đấu & Thành tích','Giải đã tham gia, bảng xếp hạng','G10')}${accountRow('gift','Phần thưởng của tôi','Quà tặng và điểm thưởng','G11')}</div>
<div class="account-group">${accountRow('globe','Quốc gia & Ngôn ngữ','Việt Nam · Tiếng Việt','ACCOUNT_LOCALE')}${accountRow('support','Trợ giúp & Hỗ trợ','Câu hỏi thường gặp, liên hệ','ACCOUNT_SUPPORT')}</div>
<button class="account-logout" id="logout">${accountIcon('logout')}<span>Đăng xuất</span></button><p class="account-version">WiiGame Portal · Phiên bản demo 1.0</p>
</section>`}
function accountSubpage(){const kind=state.page;let content='';if(kind==='ACCOUNT_HISTORY'){const pack=packages.find(p=>p.id===state.packageId);content=`<h2>Lịch sử giao dịch</h2>${pack?`<div class="account-subcard"><b>Gói đã kích hoạt: ${pack.name}</b><p>${pack.price} · ${pack.credits} lượt (demo)</p></div>`:'<div class="account-subcard"><b>Chưa có giao dịch</b><p>Gói chơi bạn kích hoạt sẽ hiển thị ở đây.</p></div>'}<div class="account-subcard"><b>Lượt chơi đã sử dụng</b><p>${state.scores.length} lượt · ${state.credits} lượt còn lại</p></div>`}else if(kind==='ACCOUNT_LOCALE'){content=`<h2>Quốc gia & Ngôn ngữ</h2><div class="account-subcard"><b>Quốc gia</b><p>Việt Nam</p><b>Ngôn ngữ</b><p>Tiếng Việt</p></div><button class="primary" id="openLocale">Xem màn chọn quốc gia / ngôn ngữ</button>`}else{content=`<h2>Trợ giúp & Hỗ trợ</h2><div class="account-subcard"><b>Làm sao để có thêm lượt chơi?</b><p>Vào Gói chơi của tôi và chọn gói phù hợp.</p></div><div class="account-subcard"><b>Không nhận được mã OTP?</b><p>Kiểm tra số điện thoại, đợi đếm ngược rồi chọn Gửi lại mã.</p></div><div class="account-subcard"><b>Đây có phải thanh toán thật không?</b><p>Không. Bản demo chỉ mô phỏng kích hoạt gói.</p></div>`}return `<section class="account-page"><div class="account-head"><button class="account-back" id="accountback" aria-label="Quay lại">${accountIcon('back')}</button><strong>WiiGame Portal</strong><span></span></div>${content}</section>`}
function loginView(){if(state.loggedIn)return accountView();return login.stage==='intro'?loginIntro():login.stage==='phone'?loginPhone():loginOtp()}
function wireLogin(){const a=$('authback');if(a)a.onclick=loginBack;const skip=$('authskip');if(skip)skip.onclick=()=>go('G02');const st=$('startlogin');if(st)st.onclick=()=>{login.stage='phone';render()};const back=$('accountback');if(back)back.onclick=()=>go(state.page.startsWith('ACCOUNT_')?'G08':'G02');const settings=$('accountsettings');if(settings)settings.onclick=()=>go('ACCOUNT_LOCALE');const locale=$('openLocale');if(locale)locale.onclick=openG01;const lo=$('logout');if(lo)lo.onclick=()=>{modal('Xác nhận đăng xuất','<p>Bạn có muốn đăng xuất khỏi WiiGame Portal?</p><button class="primary" id="confirmLogout">Đăng xuất</button>');$('confirmLogout').onclick=()=>{state.loggedIn=false;state.credits=0;state.subscribed=false;state.packageId=null;state.played=[];state.scores=[];state.favorites=[];state.tournamentJoined=false;localStorage.removeItem('wiigame_demo_auth');localStorage.removeItem('wiigame_demo_phone');localStorage.removeItem(PERSIST_KEY);login.stage='intro';login.phone='';closeModal();go('G02')}};const pi=$('phoneinput');if(pi){pi.oninput=()=>{login.phone=pi.value.replace(/\D/g,'').slice(0,10);login.error='';$('sendotp').disabled=login.phone.length<9;$('phoneerror').textContent=''};pi.onkeydown=e=>{if(e.key==='Enter')sendOtp()}}const send=$('sendotp');if(send)send.onclick=sendOtp;const re=$('resend');if(re)re.onclick=()=>{if(login.cooldown>0)return;login.otp='';login.error='';login.cooldown=30;login.sentAt=Date.now();render()};document.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{const d=b.dataset.digit;if(login.stage==='phone'){login.phone=d==='⌫'?login.phone.slice(0,-1):login.phone+(d||'');login.phone=login.phone.slice(0,10);render()}else if(login.stage==='otp'){login.otp=d==='⌫'?login.otp.slice(0,-1):login.otp+(d||'');login.otp=login.otp.slice(0,6);if(login.otp.length===6){if(login.otp==='123456'){state.loggedIn=true;localStorage.setItem('wiigame_demo_auth','1');localStorage.setItem('wiigame_demo_phone',login.phone);saveAccount();login.error='';login.stage='intro';go('G02');state.afterLogin=null;return}else login.error='Mã OTP không đúng. Vui lòng thử lại.'}render()}});}
function sendOtp(){if(login.phone.length<9||login.phone.length>10){login.error='Số điện thoại không hợp lệ. Vui lòng kiểm tra lại.';render();return}login.stage='otp';login.otp='';login.error='';login.cooldown=30;login.sentAt=Date.now();render()}
setInterval(()=>{if(login.stage!=='otp'||state.page!=='G08'||login.cooldown<=0)return;login.cooldown=Math.max(0,30-Math.floor((Date.now()-login.sentAt)/1000));const b=document.getElementById('resend');if(b){b.disabled=login.cooldown>0;b.textContent=login.cooldown?'Gửi lại mã OTP (00:'+String(login.cooldown).padStart(2,'0')+')':'Gửi lại mã OTP'}},1000);
window.addEventListener('popstate',()=>{const r=location.hash.match(/^#\/(G\d+)/);if(r){state.page=r[1];render()}});
const route=location.hash.match(/^#\/(G\d+)/);if(route&&['G02','G03','G04','G05','G06','G07','G08','G09','G10','G11','G12'].includes(route[1]))state.page=route[1];render();
</script></body></html>
